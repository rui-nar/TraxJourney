<!--
  TraxJourney app icon — design concept 6c, "Feeding in", on its dark tile.
  Exported from the TraxJourney design system. Same geometry as mark.svg, scaled
  3.2× onto a 512 px squircle.

  This file is the design source; the rasters the apps actually ship
  (favicon, PWA icons, Android launcher) are produced by
  scripts/generate_icons.py, which draws the same geometry with PIL.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="i_ribbon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3A526E"/><stop offset="0.4" stop-color="#3B82F6"/><stop offset="1" stop-color="#EF4444"/>
    </linearGradient>
    <radialGradient id="i_bg" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#1B2E48"/><stop offset="1" stop-color="#0B1420"/>
    </radialGradient>
    <filter id="i_glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="scale(3.2)">
    <rect x="0" y="0" width="160" height="160" rx="35" fill="url(#i_bg)"/>

    <path d="M14,140 C26,126 32,118 38,112 C50,102 64,112 74,104 C86,94 94,80 102,72 C112,62 126,56 136,48" fill="none" stroke="url(#i_ribbon)" stroke-width="5.5" stroke-linecap="round"/>

    <path d="M23,94.5 Q25,102 34,107.2" fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M34,107.2 L27.3,107.05 L30.1,101.75 Z" fill="#60A5FA"/>
    <path d="M99,120.5 Q89,116.5 80.4,108" fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M80.4,108 L86.7,110.3 L82.3,114.4 Z" fill="#818CF8"/>
    <path d="M79,53.5 Q85.5,57.5 95.4,66.7" fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M95.4,66.7 L89,64.8 L93,60.4 Z" fill="#C084FC"/>

    <circle cx="18" cy="88" r="10" fill="#0B1420" stroke="#60A5FA" stroke-width="2.6"/>
    <path d="M13.5,90.5 L16.5,86 L19.5,89 L23,83.5" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="106" cy="124" r="10" fill="#0B1420" stroke="#818CF8" stroke-width="2.6"/>
    <rect x="100.5" y="119.5" width="11" height="9" rx="1.8" fill="none" stroke="#818CF8" stroke-width="2"/>
    <path d="M102.5,127.5 L105.5,123 L108.5,127.5 Z" fill="#818CF8"/>
    <circle cx="72" cy="48" r="11" fill="#0B1420" stroke="#C084FC" stroke-width="2.6"/>
    <circle cx="76.2" cy="42.5" r="1.9" fill="#C084FC"/>
    <path d="M73.5,47.5 A2.7,2.7 0 0 1 78.9,47.5 Z" fill="#C084FC"/>
    <circle cx="69" cy="46.5" r="2.7" fill="#C084FC"/>
    <path d="M65.3,53.5 A3.7,3.7 0 0 1 72.7,53.5 Z" fill="#C084FC"/>

    <circle cx="38" cy="112" r="7" fill="#0B1420" stroke="#60A5FA" stroke-width="3"/>
    <circle cx="74" cy="104" r="8" fill="#0B1420" stroke="#818CF8" stroke-width="3"/>
    <circle cx="102" cy="72" r="9" fill="#0B1420" stroke="#C084FC" stroke-width="3.2"/>
    <circle cx="136" cy="48" r="13" fill="#EF4444" filter="url(#i_glow)"/>
  </g>
</svg>
