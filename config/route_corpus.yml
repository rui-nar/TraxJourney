    # measured: relation_uic, 792 km, ends 0.05/0.21 km; Agen 0.1, Bordeaux 0.0,
    # Poitiers 2.6, Limoges 88.4
    expect:
      max_endpoint_km: 1
      length_km: [750, 835]
      via:
        - {label: Agen, lat: 44.2075, lon: 0.6207, within_km: 2}
        - {label: Bordeaux Saint-Jean, lat: 44.8259, lon: -0.5560, within_km: 2}
        - {label: Poitiers, lat: 46.5823, lon: 0.3335, within_km: 5}
      avoid:
        - {label: Limoges-Benedictins, lat: 45.8364, lon: 1.2678, within_km: 45}
      strategy_not: [straight]
      degraded: false

  - name: Paris Montparnasse -> Bordeaux
    mode: rail
    from: {label: Paris Montparnasse, lat: 48.8412, lon: 2.3203}
    to: {label: Bordeaux Saint-Jean, lat: 44.8259, lon: -0.5560}
    regions: [europe/france]
    # measured: relation_uic, 536 km, ends 0.21/0.03 km; Poitiers 2.6,
    # Limoges 88.4. The #363 station-throat gap (3.5 km) does not reproduce.
    expect:
