  # town points recorded below. Bands as for rail, but
  # a crossing of a few km gets its length band rounded to 0.5 km, not 5, and
  # a via a 1 km floor, not 2. Endpoints are the ferry relation's own stops
  # where one exists, else the end nodes of the crossing's way: the berths.
