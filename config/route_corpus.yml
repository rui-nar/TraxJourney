# The route corpus: real legs and the shape their route is known to have
# (issue #345, docs/LOCAL_TRANSPORT_DATA_PLAN.md Decisions 3-4).
#
#     python scripts/route_corpus.py <store dir> [--require-all]
#
# Each leg is resolved as production resolves it under RAIL_SOURCE=local, with
# no Overpass fallback, against only the regions it names. `regions` is every
# region whose rail box reaches within 25 km of either endpoint (what the
# station and relation lookups ask) plus any the route itself runs through, so
# the answer here is the answer production's merged stores give.
#
# Leg format:
#   name, mode: rail, from/to: {label, lat, lon}, regions: [...]
#   expect:
#     max_endpoint_km    both ends of the line within this of the stations
#     length_km          [min, max]
#     via                [{label, lat, lon, within_km}]  must pass this close
#     avoid              [{label, lat, lon, within_km}]  must not pass this close
#     strategy_not       [straight, ...]
#     degraded           false
#   known_bad: <reason>  the leg is wrong today; `expect` says what right looks
#   current: {...}       like and `current` (same keys) pins today's wrong
#                        outcome. Either one moving fails the run, so a fix
#                        flips the entry in its own diff.
#
# Measured 2026-10-05 against stores built locally with `python -m
# src.rail.builder` from the `rail-data-2026-09-08` extracts (france, germany,
# denmark, spain, sweden, austria, netherlands), current resolver, no fallback;
# every route was read against the map by hand. The same stores built from
# `rail-data-2026-10-05`, one monthly refresh later, gave identical numbers on
# every leg to 0.01 km, which is the evidence the bands below survive a refresh.
#
# How the bands were chosen:
#   max_endpoint_km  1 everywhere. Every end measured within 0.21 km; the two
#                    endpoint regressions this corpus exists for were 3.5 km
#                    (#363) and 13.9 km (#359).
#   length_km        the measured length +-5 %, rounded outward to 5 km. Wide
#                    enough for a remapped junction or a relation gaining a
#                    member; narrow enough that the nearest wrong corridor falls
#                    out (Toulouse -> Austerlitz through Bordeaux is ~800 km
#                    against a 750 km ceiling; Paris Est -> Strasbourg on the
#                    classic line through Nancy ~500 against 460).
#   via              towns the line was measured passing, at about 3x the
#                    measured distance with a 2 km floor (Poitiers, 2.6 km off
#                    the LGV, gets 5). A via names the corridor, so a route that
#                    keeps its length but changes line still fails.
#   avoid            the wrong corridor's landmark, at roughly half the
#                    distance the right line keeps from it.
legs:
  # -- France: the legs of the plan's *Current state* ------------------------
  - name: Toulouse -> Paris Austerlitz
    mode: rail
    from: {label: Toulouse Matabiau, lat: 43.6113, lon: 1.4536}
    to: {label: Paris Austerlitz, lat: 48.8420, lon: 2.3650}
    regions: [europe/france, europe/spain]
    # measured: relation_uic, 712 km, ends 0.05/0.14 km; Limoges 0.0, Brive 0.8,
    # Les Aubrais 0.1, Bordeaux 150.1
    expect:
      max_endpoint_km: 1
      length_km: [675, 750]
      via:
        - {label: Brive-la-Gaillarde, lat: 45.1593, lon: 1.5323, within_km: 3}
        - {label: Limoges-Benedictins, lat: 45.8364, lon: 1.2678, within_km: 2}
        - {label: Les Aubrais, lat: 47.9265, lon: 1.9073, within_km: 2}
      avoid:
        - {label: Bordeaux Saint-Jean, lat: 44.8259, lon: -0.5560, within_km: 75}
      strategy_not: [straight]
      degraded: false

  - name: Toulouse -> Paris Montparnasse
    mode: rail
    from: {label: Toulouse Matabiau, lat: 43.6113, lon: 1.4536}
    to: {label: Paris Montparnasse, lat: 48.8412, lon: 2.3203}
