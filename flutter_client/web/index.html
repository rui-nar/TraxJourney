<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!--
    Required, not optional. Without it mobile browsers lay the page out in a
    980 px viewport and then shrink it to fit, which puts both splashes on the
    wrong side of the 760px breakpoint below and paints the wide board — twice
    the width of the screen — before the shrink lands. See issue #177.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TraxJourney — Merge · Visualise · Export">

  <!-- Google Sign-In (required by google_sign_in_web) -->
  <meta name="google-signin-client_id" content="544571555396-gj0q3hndadfo00ifotme305jcf4ii5cc.apps.googleusercontent.com">

  <!-- Start DNS + TLS for Google Fonts CDN before Flutter boots -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!--
    Boot splash, shown until the Flutter engine renders its first frame and then
    removed. Deliberately a copy of lib/src/core/splash_screen.dart — same field,
    grid, mark, type and 760px breakpoint — so the handover is invisible. Change
    the two together.
  -->
  <style>
    body { margin: 0; background: #0B1420; }
    #fl-splash {
      position: fixed; inset: 0; z-index: 9;
      font-family: Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px) 0 0 / 40px 40px,
        linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px) 0 0 / 40px 40px,
        radial-gradient(ellipse 120% 80% at 50% 18%, #132238 0%, #0B1420 55%, #080F18 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    #fl-splash .mark { width: 168px; height: 168px; }
    #fl-splash .copy { text-align: center; }
    #fl-splash .wordmark {
      margin-top: 34px;
      font-weight: 700; font-size: 28px; line-height: 1.1;
      color: #E2E8F0; letter-spacing: -0.01em;
    }
    #fl-splash .tagline {
      margin-top: 10px;
      font-weight: 500; font-size: 12px; line-height: 1.4;
      color: #64748B; letter-spacing: 0.1em; text-transform: uppercase;
    }
    #fl-splash .blurb { display: none; }
    #fl-splash .foot {
      position: absolute; left: 0; right: 0; bottom: 52px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    #fl-splash .track {
      width: 132px; height: 2px; border-radius: 2px;
      background: #1E3350; overflow: hidden;
    }
    #fl-splash .track > i {
      display: block; width: 62%; height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, #3B82F6, #EF4444);
      animation: fl-sweep-narrow 1.4s linear infinite;
    }
    /*
      Matches the Dart _ProgressBar: the 62%-wide fill starts just off the left
      edge (-100% of its own width) and ends just off the right (the full track
      width). One keyframe set per track width, since the end offset is absolute.
    */
    @keyframes fl-sweep-narrow {
      from { transform: translateX(-100%); }
      to   { transform: translateX(132px); }
    }
    @keyframes fl-sweep-wide {
      from { transform: translateX(-100%); }
      to   { transform: translateX(120px); }
    }
    /*
      Left empty: static HTML has no access to APP_VERSION, which is a
      --dart-define. It still reserves the line's height so the progress bar
      sits at the same offset here as in the Dart splash, which does fill it in.
    */
    #fl-splash .version {
      min-height: 15px;
      font-weight: 400; font-size: 11px; line-height: 1.4;
      color: #3A526E; letter-spacing: 0.04em;
    }
    #fl-splash .loading { display: none; }

    /* Large board: mark beside the wordmark, foot split left and right. */
    @media (min-width: 760px) {
      #fl-splash {
        flex-direction: row; gap: 56px;
        background:
          linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px) 0 0 / 40px 40px,
          linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px) 0 0 / 40px 40px,
          radial-gradient(ellipse 110% 95% at 50% 12%, #132238 0%, #0B1420 55%, #080F18 100%);
      }
      #fl-splash .mark { width: 228px; height: 228px; }
      #fl-splash .rule { width: 1px; height: 184px; background: #2D4A6A; }
      #fl-splash .copy {
        display: flex; flex-direction: column; align-items: flex-start;
        max-width: 380px; text-align: left;
      }
      #fl-splash .wordmark { margin-top: 0; font-size: 52px; letter-spacing: -0.02em; }
      #fl-splash .tagline { margin-top: 16px; font-size: 13px; letter-spacing: 0.12em; }
      #fl-splash .blurb {
        display: block; margin-top: 20px;
        font-weight: 400; font-size: 15px; line-height: 1.6; color: #94A3B8;
      }
      #fl-splash .foot {
        left: auto; right: 40px; bottom: 32px;
        flex-direction: row; align-items: center; gap: 10px;
      }
      #fl-splash .track { width: 120px; }
      #fl-splash .track > i { animation-name: fl-sweep-wide; }
      #fl-splash .loading {
        display: block;
        font-weight: 500; font-size: 11px; line-height: 1; color: #64748B;
      }
      /* fixed, not absolute: .foot is itself positioned, so absolute would
         resolve against that thin bar instead of the viewport. */
      #fl-splash .version {
        position: fixed; left: 40px; bottom: 32px; min-height: 0; font-size: 12px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      #fl-splash .track > i { animation: none; }
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TraxJourney">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TraxJourney</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="fl-splash">
    <!-- The brand mark, kept in step with assets/mark.svg. -->
    <svg class="mark" viewBox="0 0 160 160" aria-hidden="true">
      <defs>
        <linearGradient id="fl_ribbon" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#3A526E"/><stop offset="0.4" stop-color="#3B82F6"/><stop offset="1" stop-color="#EF4444"/>
        </linearGradient>
        <filter id="fl_glow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="4.5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <path d="M14,140 C26,126 32,118 38,112 C50,102 64,112 74,104 C86,94 94,80 102,72 C112,62 126,56 136,48" fill="none" stroke="url(#fl_ribbon)" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M23,94.5 Q25,102 34,107.2" fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M34,107.2 L27.3,107.05 L30.1,101.75 Z" fill="#60A5FA"/>
      <path d="M99,120.5 Q89,116.5 80.4,108" fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M80.4,108 L86.7,110.3 L82.3,114.4 Z" fill="#818CF8"/>
      <path d="M79,53.5 Q85.5,57.5 95.4,66.7" fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M95.4,66.7 L89,64.8 L93,60.4 Z" fill="#C084FC"/>
      <circle cx="18" cy="88" r="10" fill="#0B1420" stroke="#60A5FA" stroke-width="2.6"/>
      <path d="M13.5,90.5 L16.5,86 L19.5,89 L23,83.5" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="106" cy="124" r="10" fill="#0B1420" stroke="#818CF8" stroke-width="2.6"/>
      <rect x="100.5" y="119.5" width="11" height="9" rx="1.8" fill="none" stroke="#818CF8" stroke-width="2"/>
      <path d="M102.5,127.5 L105.5,123 L108.5,127.5 Z" fill="#818CF8"/>
      <circle cx="72" cy="48" r="11" fill="#0B1420" stroke="#C084FC" stroke-width="2.6"/>
      <circle cx="76.2" cy="42.5" r="1.9" fill="#C084FC"/>
      <path d="M73.5,47.5 A2.7,2.7 0 0 1 78.9,47.5 Z" fill="#C084FC"/>
      <circle cx="69" cy="46.5" r="2.7" fill="#C084FC"/>
      <path d="M65.3,53.5 A3.7,3.7 0 0 1 72.7,53.5 Z" fill="#C084FC"/>
      <circle cx="38" cy="112" r="7" fill="#0B1420" stroke="#60A5FA" stroke-width="3"/>
      <circle cx="74" cy="104" r="8" fill="#0B1420" stroke="#818CF8" stroke-width="3"/>
      <circle cx="102" cy="72" r="9" fill="#0B1420" stroke="#C084FC" stroke-width="3.2"/>
      <circle cx="136" cy="48" r="13" fill="#EF4444" filter="url(#fl_glow)"/>
    </svg>
    <div class="rule"></div>
    <div class="copy">
      <div class="wordmark">TraxJourney</div>
      <div class="tagline">Merge · Visualise · Export</div>
      <div class="blurb">Merge Strava rides, segments and memories into one continuous journey.</div>
    </div>
    <div class="foot">
      <div class="track"><i></i></div>
      <div class="loading">Loading</div>
      <div class="version"></div>
    </div>
  </div>

  <!--
    Hand over to Flutter's own splash. flutter-first-frame fires once the engine
    has actually painted, so there is no gap and no overlap.
  -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('fl-splash');
      if (splash) splash.remove();
    });
  </script>

  <!-- Android PWA black-screen recovery — see reload_guard.js for details. -->
  <script src="reload_guard.js"></script>
  <script>
    if (window.__traxJourneyReloadGuard) {
      window.__traxJourneyReloadGuard.createReloadGuard();
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
