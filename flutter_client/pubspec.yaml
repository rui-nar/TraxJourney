name: traxjourney_client
description: TraxJourney Flutter client — web, Android, iOS.
publish_to: 'none'

version: 0.50.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.2

  # Navigation
  go_router: ^18.0.0

  # State management
  provider: ^6.1.2

  # Auth
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3

  # File picking (web + native)
  file_picker: ^12.1.1

  # Open URLs in browser (Strava OAuth connect)
  url_launcher: ^6.3.0
  url_launcher_web: ^2.3.3
  web: ^1.1.0

  # Native / Web Share API hand-off for social sharing
  share_plus: ^13.3.0

  # Persist user preferences (theme mode)
  shared_preferences: ^2.3.2

  # Typography
  google_fonts: ^8.1.0

  # Color picker
  flutter_colorpicker: ^1.1.0

  # Map + charts
  flutter_map: ^8.3.0
  flutter_map_animations: ^0.10.0
  latlong2: ^0.9.1
  fl_chart: ^1.2.0

  # On-device project data cache (Android/iOS only)
  sqflite: ^2.4.1

  # Device location — encounter location picker defaults to current position
  geolocator: ^14.0.2
  vector_map_tiles: 9.0.0-beta.9
  vector_tile_renderer: ^6.0.0
  cryptography_plus: ^3.0.0
  flutter_secure_storage: ^10.3.1

  # Photo upgrade: EXIF capture time/GPS + image decoding for pHash (pure Dart, web-safe)
  exif: ^3.3.0
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Referenced directly by the file_picker fakes: PlatformFile.xFile is part of
  # the abstract interface tests have to implement since file_picker 12.
  cross_file: ^0.3.5
  flutter_lints: ^6.0.0
  # Referenced directly by the saved-UI-state tests, which stand in a store that
  # refuses writes to prove a failed save deletes nothing (#409).
  shared_preferences_platform_interface: ^2.4.2
  # Regenerates the Android launcher icons from the assets/app_icon*.png layers.
  # Not part of any build — run by hand when the brand mark changes:
  #   python scripts/generate_icons.py && dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true

# Android only — iOS keeps its own icon pipeline until that platform ships.
# All three layers come from scripts/generate_icons.py: the flat icon, and the
# adaptive icon's dark radial field plus the brand mark inset into its safe zone.
# The background is an image, not a colour, so the field keeps its radial lift.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "../assets/app_icon.png"
  adaptive_icon_background: "../assets/app_icon_background.png"
  adaptive_icon_foreground: "../assets/app_icon_foreground.png"
  # The generator's default 16% inset would shrink an already-inset glyph twice.
  adaptive_icon_foreground_inset: 0

flutter_map:
  suppress_osm_warning: true


