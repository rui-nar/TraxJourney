# Auto-provisioned Grafana datasources. No secrets in this file — committed
# as-is, no .example copy step needed.
#
# Both point at localhost, not a service name: Loki, Prometheus and Grafana
# all run with `network_mode: service:tailscale` in docker-compose.yml.example,
# so they share one network namespace with the tailscale container and reach
# each other over loopback, not Docker's usual bridge-network service
# discovery.
#
# No `uid:` here on purpose. An earlier version of this file pinned fixed
# datasource UIDs so dashboards could reference them
# deterministically — confirmed live against grafana/grafana:latest (13.1.3)
# that this makes the provisioning module fail outright on every start with
# "Datasource provisioning error: data source not found", crash-looping the
# whole container. Dashboards now use a `datasource`-type template variable
# instead (resolves to whichever Prometheus/Loki datasource exists, however
# it got its UID), so a fixed UID here isn't needed at all.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://localhost:3100
    editable: false
