name: Build and publish Docker image

on:
  push:
    tags:
      - 'v*'
      # 'v*' already glob-matches this literally, but it's listed explicitly
      # so the trigger doesn't rely on that coincidence (issue #190). The
      # validation build gets its own tag-selection step below — it must
      # never touch `:latest`, which real v* releases own.
      - 'validation'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The `validation` tag is floating (re-pushed to a new commit each time),
      # so `github.ref_name` alone is always just "validation" — giving no way
      # to tell which commit a running validation build is on. Real v* tags are
      # one-shot and already identify their commit, so they pass through as-is.
      - name: Determine app version
        id: app_version
        run: |
          if [ "${{ github.ref_name }}" = "validation" ]; then
            version="validation-$(git rev-parse --short "${{ github.sha }}")"
          else
            version="${{ github.ref_name }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Flutter Web
        working-directory: flutter_client
        run: |
          flutter pub get
          flutter build web --release --dart-define=APP_VERSION=${{ steps.app_version.outputs.version }} --dart-define=MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }}

      - name: Stage Flutter build output for Docker
        run: cp -r flutter_client/build/web web_client

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # `validation` is a floating tag: force-push it to re-cut the validation
      # image from here instead of from a Windows working tree with deploy.ps1
      # (git tag -f validation <commit> && git push origin validation --force).
      # Building on ubuntu-latest sidesteps the CRLF shebang failure from
      # issue #190 entirely. It only ever produces :validation — never
      # :latest or a :<sha> tag, both of which belong to real v* releases.
      - name: Select image tags
        id: image_tags
        run: |
          if [ "${{ github.ref_name }}" = "validation" ]; then
            tags="ghcr.io/rui-nar/traxjourney:validation"
          else
            tags=$(printf 'ghcr.io/rui-nar/traxjourney:latest\nghcr.io/rui-nar/traxjourney:%s\nghcr.io/rui-nar/traxjourney:%s' "${{ github.sha }}" "${{ github.ref_name }}")
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # A package pushed with a PAT (GHCR_TOKEN) is linked to its repository only
      # through this label; the Dockerfile sets the same one for local builds.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          labels: org.opencontainers.image.source=https://github.com/rui-nar/TraxJourney
          build-args: |
            APP_VERSION=${{ steps.app_version.outputs.version }}
          tags: ${{ steps.image_tags.outputs.tags }}
