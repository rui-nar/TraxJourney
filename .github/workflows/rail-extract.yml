name: Rail extract

# Builds the OSM artifacts route resolution runs on (issue #345): per region, a
# rail, a ferry and a bus extract, filtered from one download.
#
# This is on a runner and not on the VPS because of one number: the raw Europe
# extract is 34.9 GB and the box has 40 GB in total, prod and val included.
# A throwaway runner downloads a country, throws 99.9 % of it away, and
# publishes the few megabytes that are left.
#
# Monthly. Rail alignments change over years, not weeks, and every artifact
# carries the source extract's own date, so "how old is this data" is always
# answerable from the manifest rather than from this schedule.
on:
  schedule:
    - cron: "20 3 2 * *"
  workflow_dispatch:
    inputs:
      regions:
        description: "Regions to rebuild, space or comma separated (default: all configured)"
        required: false
        default: ""
      force_publish:
        description: "Publish even if regions are missing from the manifest"
        required: false
        type: boolean
        default: false

# One build at a time: two concurrent runs would race on the same release tag.
concurrency:
  group: rail-extract
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Coverage lives in config/rail_regions.yml, so the matrix has to be read at
  # run time — adding a country must never require editing this file.
  plan:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.regions.outputs.regions }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - run: pip install PyYAML

      - name: Resolve the region matrix
        id: regions
        # Via the environment, never interpolated into the shell: a dispatch
        # input is attacker-controlled text as far as the runner is concerned.
        env:
          REQUESTED: ${{ inputs.regions }}
        run: |
          if [ -n "$REQUESTED" ]; then
            regions=$(python -c 'import json, os; print(json.dumps(os.environ["REQUESTED"].replace(",", " ").split()))')
          else
            regions=$(python scripts/build_rail_extract.py regions --json)
          fi
          echo "regions=$regions" >> "$GITHUB_OUTPUT"
          echo "$regions"

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # One country failing (a renamed Geofabrik path, a mirror hiccup) must not
      # cost the other 48 their build.
      fail-fast: false
      # Geofabrik is a free service run on donated bandwidth; six parallel
      # downloads is neighbourly and still finishes the continent in under an
      # hour.
      max-parallel: 6
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regions) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install osmium
        # The C++ CLI does the pass over the raw extract. The equivalent
        # pyosmium loop measured 2,022 s for Germany in the spike.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool

      - run: pip install osmium requests PyYAML

      - name: Filter ${{ matrix.region }}
        env:
          REGION: ${{ matrix.region }}
        run: |
          python scripts/build_rail_extract.py build "$REGION" \
            --out-dir dist/rail \
            --work-dir "$RUNNER_TEMP/rail-work"

      - name: Guard — nothing raw leaves this job
        # The script deletes the source extract as soon as it has been filtered,
        # so this is a tripwire on that promise rather than the mechanism: the
        # biggest raw country is 4.83 GB, and each layer has a ceiling well
        # under it and well over what it holds — rail single-digit megabytes
        # (100 MB), ferry well under one (20 MB), bus ~125 MB for Germany
        # (300 MB). A file over its layer's ceiling is a raw or half-filtered
        # extract about to be uploaded.
        #
        # Rail, or any file that is not a ferry or bus extract, over 100 MB
        # stops the job. A ferry or bus extract over its ceiling is deleted
        # with its entry instead: nothing raw leaves either way, and a broken
        # bus layer must not cost the region its rail — the manifest step then
        # warns that the layer is missing, and that mode keeps going to
        # Overpass.
        run: |
          shopt -s nullglob
          failed=0
          for file in dist/rail/*; do
            case "$file" in
              *-ferry.osm.pbf) layer=ferry limit=20 ;;
              *-bus.osm.pbf) layer=bus limit=300 ;;
              *) layer="" limit=100 ;;
            esac
            if [ -z "$(find "$file" -size +"$limit"M)" ]; then
              continue
            fi
            if [ -n "$layer" ]; then
              echo "::warning::$file is over the $layer layer's $limit MB ceiling — dropped, the region publishes without its $layer layer"
              rm -f "$file" "${file%.osm.pbf}.entry.json"
            else
              echo "::error::$file is over $limit MB — an unfiltered extract reached the publish directory"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          if find "$RUNNER_TEMP/rail-work" -name '*-source.osm.pbf' | grep .; then
            echo "::error::the raw extract was not deleted after filtering"
            exit 1
          fi

      - name: Name the artifact
        id: slug
        env:
          REGION: ${{ matrix.region }}
        run: echo "slug=${REGION##*/}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: rail-${{ steps.slug.outputs.slug }}
          path: dist/rail/
          # Transport between jobs in this run, not storage: the release is
          # where the artifacts actually live.
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [plan, build]
    # Runs even when some of the matrix failed — not to publish whatever built,
    # but so the manifest step can name what is missing and fail loudly. A
    # country that failed has no release asset of its own here: a rebuild that
    # creates a new dated release starts empty, so an omitted region is one
    # phase 3 reads as "not covered" and sends back to Overpass, which is the
    # service that banned us. Hence the completeness check below.
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # What this job actually patched, for notify — which has no `contents`
      # permission to look the release up with, and should not second-guess it.
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # Everything, not the builder's three: the corpus gate below resolves
      # legs with the server's own resolver, which imports what the server
      # imports, and a hand-picked list breaks on its next new import.
      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          path: dist/rail
          pattern: rail-*
          merge-multiple: true

      - name: Resolve the release this run updates
        id: release
        # A full run publishes a new dated release. A subset rebuild patches the
        # release it is fixing instead of opening a new one, because the regions
        # it did not rebuild exist only as that release's assets: a new tag would
        # hold Denmark and nothing else, and "latest rail-data-*" would resolve
        # to it.
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.regions }}
        run: |
          tag=""
          if [ -n "$REQUESTED" ]; then
            tag=$(gh release list --limit 100 --json tagName \
              --jq '[.[] | select(.tagName | startswith("rail-data-"))]
                    | max_by(.tagName) | .tagName // empty')
          fi
          if [ -z "$tag" ]; then
            tag="rail-data-$(date -u +%Y-%m-%d)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "updating $tag"

      - name: Fetch the manifest being updated
        # The base of the merge, and it must come from the very release we are
        # about to upload into — carrying an entry forward into a release that
        # does not hold its .pbf would publish a manifest pointing at nothing.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          REQUESTED: ${{ inputs.regions }}
        run: |
          mkdir -p released
          release_exists=no
          if gh release view "$TAG" >/dev/null 2>&1; then
            release_exists=yes
            gh release download "$TAG" --pattern manifest.json --dir released \
              || echo "no manifest.json on $TAG yet"
          fi
          # A subset rebuild carries the regions it did not build from this
          # manifest. Without it the merge has nothing to merge into and the
          # step below publishes a manifest holding only what this run built
          # — the exact regression the merge was added to prevent,
          # which `--expect` cannot see because it equals the subset asked
          # for. A full run has no base by design, so this guards the subset.
          #
          # But only when there is something to disown. If the release does
          # not exist yet this is the bootstrap case: the first ever run, or
          # the first of a new month, and a one-region manifest is then the
          # honest description of a release that holds one region. Refusing
          # it made it impossible to seed coverage a country at a time,
          # which is how the first real run of this pipeline was meant to go.
          if [ -n "$REQUESTED" ] && [ "$release_exists" = yes ] && [ ! -f released/manifest.json ]; then
            echo "::error::subset rebuild of $TAG but its manifest could not be fetched — publishing now would drop every region this run did not build"
            exit 1
          fi

      - name: Build and verify the manifest
        # Re-checksums every file after the artifact round trip, so a truncated
        # upload fails here rather than on the box at boot; merges the regions
        # this run did not rebuild in from the release's own manifest; and
        # refuses to publish one that covers fewer regions than the run was
        # supposed to produce.
        env:
          EXPECTED: ${{ needs.plan.outputs.regions }}
          FORCE: ${{ inputs.force_publish }}
        run: |
          force=""
          if [ "$FORCE" = "true" ]; then
            force="--force"
          fi
          python scripts/build_rail_extract.py manifest \
            --out-dir dist/rail \
            --base released/manifest.json \
            --expect "$EXPECTED" $force

      - name: Check the route corpus
        # A manifest can be complete and checksummed and still describe data
        # that routes Toulouse to Paris through Bordeaux. So before anything is
        # uploaded, every corpus region the manifest holds is built into a
        # store exactly as the box will build it, and config/route_corpus.yml
        # is resolved against them; a FAIL or a known-bad leg that moved
        # stops the job here.
        #
        # The whole release is gated, not just what this run rebuilt: a
        # subset run fetches the regions it carries from the release it is
        # patching, because that release, as a whole, is what the box
        # installs — and the resolver may have changed since they were last
        # checked. A full run passes --require-all, since every corpus region
        # was just built; a subset run lets a leg skip only when the release
        # does not hold its region at all (seeding coverage a country at a
        # time).
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          REQUESTED: ${{ inputs.regions }}
          FORCE: ${{ inputs.force_publish }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "::warning::force_publish: the route corpus gate was skipped"
            exit 0
          fi
          stores="$RUNNER_TEMP/rail-stores"
          carried="$RUNNER_TEMP/rail-carried"
          mkdir -p "$stores" "$carried"
          cp dist/rail/manifest.json "$stores/"
          # region, file, sha256, store name: each corpus region the manifest
          # lists as ok, rail entries only — the corpus is rail legs, and a
          # ferry or bus entry for the same region names another file. An
          # entry without `layer` is rail. A file, not a pipe, so `-e` sees a
          # failure in it.
          python -c '
          import json, yaml
          from src.rail.store import store_filename
          legs = yaml.safe_load(open("config/route_corpus.yml", encoding="utf-8"))["legs"]
          named = {region for leg in legs for region in leg["regions"]}
          for e in json.load(open("dist/rail/manifest.json", encoding="utf-8"))["regions"]:
              if (e["region"] in named and e.get("layer", "rail") == "rail"
                      and e.get("status", "ok") == "ok"):
                  print(e["region"], e["file"], e["sha256"],
                        store_filename(e["region"], "rail"), sep="\t")
          ' > "$RUNNER_TEMP/corpus-regions.tsv"
          while IFS=$'\t' read -r region file sha store; do
            pbf="dist/rail/$file"
            if [ ! -f "$pbf" ]; then
              gh release download "$TAG" --pattern "$file" --dir "$carried" --clobber
              pbf="$carried/$file"
              echo "$sha  $pbf" | sha256sum -c -
            fi
            echo "building $region from $pbf"
            python -m src.rail.builder "$pbf" "$stores/$store" --region "$region" --layer rail
          done < "$RUNNER_TEMP/corpus-regions.tsv"
          require_all=""
          if [ -z "$REQUESTED" ]; then
            require_all="--require-all"
          fi
          python scripts/route_corpus.py "$stores" $require_all

      - name: Publish the release
        # A release asset, not a Docker layer: baking the data into the image
        # would couple a data refresh to a code release and inflate every image
        # by the size of Europe's railways. Marked pre-release so it never
        # displaces the app's own latest release.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --prerelease \
              --title "Rail extracts $TAG" \
              --notes "Rail, ferry and bus OSM extracts built by .github/workflows/rail-extract.yml from Geofabrik country extracts. Coverage, checksums and per-region, per-layer source dates are in manifest.json."
          fi
          # A layer that is empty publishes no .pbf, so a glob can be empty.
          shopt -s nullglob
          extracts=(dist/rail/*-rail.osm.pbf dist/rail/*-ferry.osm.pbf dist/rail/*-bus.osm.pbf)
          gh release upload "$TAG" \
            "${extracts[@]}" dist/rail/manifest.json --clobber

  # A monthly job nobody watches fails silently, and the box keeps serving last
  # month's data — or none, for a region that never built — without anyone
  # knowing. So a failure files one `rail-data` issue (commented on, not
  # duplicated, by the runs that keep failing) and the next good run closes it.
  # Issues only: this job never touches the release, so it gets no `contents`.
  notify:
    needs: [plan, build, publish]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      # No checkout, so gh has no git remote to infer the repository from.
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report the failure
        # A cancelled run is someone's decision, not a fault; it reports nothing.
        if: contains(needs.*.result, 'failure')
        env:
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
          PUBLISH: ${{ needs.publish.result }}
        run: |
          failed=$(printf '%s\n' "plan=$PLAN" "build=$BUILD" "publish=$PUBLISH" \
            | sed -n 's/=failure$//p' | paste -sd, - | sed 's/,/, /g')
          body="Rail extract run $RUN_URL failed in: $failed"
          number=$(gh issue list --label rail-data --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "Rail extract failed" --label rail-data --body "$body"
          fi

      - name: Close the failure report
        if: >-
          needs.plan.result == 'success' &&
          needs.build.result == 'success' &&
          needs.publish.result == 'success'
        env:
          TAG: ${{ needs.publish.outputs.tag }}
          REQUESTED: ${{ inputs.regions }}
        run: |
          # A subset rebuild patches the latest release, whatever month it is
          # from. Green then reads as "this month's data is out" when no
          # release exists for this month, so say so where it is seen.
          note=""
          month=$(date -u +%Y-%m)
          tag_date=${TAG#rail-data-}
          if [ -n "$REQUESTED" ] && [ "${tag_date:0:7}" != "$month" ]; then
            note="subset run patched $TAG; no rail-data release exists for $month"
            echo "::warning::$note"
          fi
          body="Rail extract run $RUN_URL succeeded."
          if [ -n "$note" ]; then
            body="$body"$'\n\n'"$note"
          fi
          for number in $(gh issue list --label rail-data --state open \
                            --json number --jq '.[].number'); do
            gh issue close "$number" --comment "$body"
          done
