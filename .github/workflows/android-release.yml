name: Build and publish Android APK

# Runs alongside docker-build.yml on every vX.Y.Z tag: that one ships the server
# image and the web client, this one ships the Android app for the same tag.
# Also runs on the floating `validation` tag (issue #190) for the same reason
# docker-build.yml does: 'v*' already glob-matches it literally, but it's
# listed explicitly so the trigger doesn't rely on that coincidence.
on:
  push:
    tags:
      - 'v*'
      - 'validation'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release upload

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fail fast without signing secrets
        # An unsigned (or debug-signed) APK cannot be upgraded in place and must
        # never reach a release page. Say so up front rather than 40 minutes into
        # a gradle build. See docs/ANDROID.md for creating these.
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Run scripts/new-android-keystore.ps1 and add the ANDROID_* repository secrets (docs/ANDROID.md)."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # Read by flutter_client/android/app/build.gradle.kts.
          cat > flutter_client/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Resolve build version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$TAG" = "validation" ]; then
            # The `validation` tag/release (issue #190) is the trigger for this
            # build, not a real version: it's created and moved by hand (there's
            # no other way to kick this workflow off on demand), so it carries
            # no vX.Y.Z of its own and android_version_code.py can't map it.
            # Anchor the versionCode one above the latest real release instead,
            # so a validation build installs over the currently-shipped app for
            # upgrade-path testing. This can tie with the very next real
            # release's own code (e.g. a plain patch bump), which blocks
            # installing over the validation build until it's uninstalled —
            # acceptable for an internal test artifact.
            # Filter to tags that actually look like vX.Y.Z: the `validation`
            # release itself is more recently published than any real release,
            # so without this filter it comes back as "latest" and feeds
            # straight back into android_version_code.py, reproducing this
            # exact failure.
            LATEST_TAG=$(gh release list --exclude-drafts -L 30 --json tagName \
              --jq '[.[] | select(.tagName | test("^v[0-9]"))][0].tagName' || true)
            BASE=0
            if [ -n "$LATEST_TAG" ]; then
              BASE=$(python3 scripts/android_version_code.py "$LATEST_TAG")
            fi
            BUILD_NUMBER=$((BASE + 1))
            APP_VERSION="validation-$(git rev-parse --short HEAD)"
            BUILD_NAME="$APP_VERSION"
          else
            # versionCode must increase every release or Android refuses the
            # upgrade; pubspec's +1 never moves, so derive it from the tag.
            BUILD_NUMBER=$(python3 scripts/android_version_code.py "$TAG")
            APP_VERSION="$TAG"
            BUILD_NAME="${TAG#v}"
          fi
          echo "versionCode for $TAG: $BUILD_NUMBER"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"

      - name: Build signed APK
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd flutter_client
          flutter pub get
          # arm64-v8a only: every Android phone sold since ~2017 is 64-bit, and
          # this app is sideload-only (no Play Store to do per-device splitting
          # for us), so a single arm64 APK is both the smallest and the simplest
          # file to hand out. Cuts the release APK roughly 3x versus bundling
          # armeabi-v7a and x86_64 native libs nobody installing today needs.
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-number="${{ steps.version.outputs.build_number }}" \
            --build-name="${{ steps.version.outputs.build_name }}" \
            --dart-define=APP_VERSION="${{ steps.version.outputs.app_version }}" \
            --dart-define=MAPBOX_TOKEN="${{ secrets.MAPBOX_TOKEN }}" \
            --dart-define=API_BASE_URL=https://traxjourney.com
          mv build/app/outputs/flutter-apk/app-release.apk \
             "$RUNNER_TEMP/traxjourney-$TAG.apk"

      - name: Verify the APK is release-signed
        # Catches a keystore that decoded but signed with the wrong identity —
        # the failure mode that only shows up as "app not installed" on a device
        # that already has a copy signed by the real key.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/traxjourney-$TAG.apk" | tee certs.txt
          grep -qi "SHA-256 digest" certs.txt
          if grep -qi "CN=Android Debug" certs.txt; then
            echo "::error::APK is signed with the debug key."
            exit 1
          fi

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # bump_version_and_release.ps1 creates the release seconds after
          # pushing the tag, and this job has been building for far longer than
          # that — but a hand-pushed tag may have no release at all, so poll
          # briefly and create one rather than dropping the APK on the floor.
          # The `validation` release always exists by the time this runs, since
          # creating it is what triggers this workflow in the first place.
          for _ in $(seq 12); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            echo "waiting for release $TAG ..."
            sleep 10
          done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "TraxJourney $TAG" --generate-notes
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/traxjourney-$TAG.apk" --clobber
