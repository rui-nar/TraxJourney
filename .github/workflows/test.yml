name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check migrations are in sync with models
        # Applies every migration to a fresh SQLite database, then asks Alembic
        # whether autogenerate would produce any further changes.  Exits non-zero
        # if the SQLModel metadata and the migration head have drifted apart —
        # i.e. someone added a column without a migration, or vice versa.
        env:
          DATABASE_URL: sqlite:///./ci_alembic_check.db
        run: |
          alembic upgrade head
          alembic check
          rm -f ci_alembic_check.db

      - name: Install ffmpeg (trip-video renderer tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run tests
        run: pytest tests/ --ignore=tests/test_gui.py --ignore=tests/test_gui_launch.py --ignore=tests/test_map_widget.py --ignore=tests/test_export_options_widget.py --ignore=tests/test_filter_widget.py --ignore=tests/test_stats_bar.py --ignore=tests/test_toast.py -v --tb=short

  flutter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: flutter_client
        run: flutter pub get

      - name: Analyze
        working-directory: flutter_client
        run: flutter analyze

      - name: Run tests
        working-directory: flutter_client
        run: flutter test

  android:
    # The Android build is the only thing that exercises the gradle config, the
    # manifest merge and the plugin set on that platform — `flutter test` runs on
    # the VM and would stay green through a broken APK (issue #136).
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: flutter_client
        run: flutter pub get

      - name: Build debug APK
        # Debug, so no signing secrets are needed and forks can run it.
        working-directory: flutter_client
        run: flutter build apk --debug

  ios:
    # Same reason as the android job: with no Mac in the loop, a broken Xcode
    # project, entitlements wiring or plugin set would otherwise only surface
    # when a release tag is pushed (#579).
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: flutter_client
        run: flutter pub get

      - name: Lint the new plists
        working-directory: flutter_client/ios
        run: plutil -lint Runner/Runner.entitlements Runner/PrivacyInfo.xcprivacy ExportOptions.plist

      - name: Build iOS release (unsigned)
        # No signing, so no secrets are needed and forks can run it.
        working-directory: flutter_client
        run: flutter build ios --release --no-codesign

      - name: Check the privacy manifest is in the bundle
        working-directory: flutter_client
        run: |
          test -f build/ios/iphoneos/Runner.app/PrivacyInfo.xcprivacy
          echo "PrivacyInfo.xcprivacy is in Runner.app"

      - name: Check the entitlements are wired in
        working-directory: flutter_client/ios
        run: |
          for config in Debug Release Profile; do
            xcodebuild -project Runner.xcodeproj -target Runner -configuration "$config" -showBuildSettings \
              | grep -E '^ +CODE_SIGN_ENTITLEMENTS = Runner/Runner\.entitlements$'
            echo "$config: CODE_SIGN_ENTITLEMENTS is set"
          done
