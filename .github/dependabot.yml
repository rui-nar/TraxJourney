version: 2

# Keeps the lock, uv and the actions current (docs/plans/UV_MIGRATION_PLAN.md,
# Decision 7). Merging stays manual. Security advisories open their own PRs
# regardless of this schedule.
updates:
  # pyproject.toml and uv.lock: minor and patch updates in one PR, each major
  # on its own.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # The Dockerfile's uv stage. Its PR fails CI until the setup-uv `version:`
  # in the workflows moves to the same tag (tests/test_ci_workflows.py).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A CPython minor is a deliberate change of .python-version, the
      # Dockerfile and requires-python together, never a Dependabot PR; the
      # 3.14-slim tag already floats to the latest 3.14 patch at each build.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
